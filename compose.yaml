services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medusashop-backend
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # DATABASE_URL and REDIS_URL are provided externally (see .env / your host).
